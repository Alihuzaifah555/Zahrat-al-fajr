<!-- Modern Contact Banner with Background Image -->
<section class="contact-hero-new">
  <div class="text-center">
    <h1 class="hero-title">Contact Us</h1>
    <p class="hero-subtitle">We'd love to hear from you. Please don't hesitate to get in touch.</p>
  </div>
</section>

<!-- Contact Details Section -->
<section class="section">
  <div class="container">
    <div class="row text-center">
      <div class="col-md-4">
        <div class="info-card">
          <i class="bi bi-geo-alt"></i>
          <h3>Our Address</h3>
          <p>FZ MEYDAN GRANDSTAND 6TH FLOOR<br>MEYDAN ROAD NAD AL SHEBA, DUBAI U.A.E</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="info-card">
          <i class="bi bi-telephone"></i>
          <h3>Phone</h3>
          <p>+971 56 357 9348</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="info-card">
          <i class="bi bi-envelope"></i>
          <h3>Email</h3>
          <p>info&#64;laraibfoodstuff.com</p>
        </div>
      </div>
    </div>
  </div>
</section>
